<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kormo Invest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Base: fond noir plein écran, centrage vertical ── */
    html, body {
      height: 100%;
    }

    body {
      background-color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
    }

    /* ── Carte ── */
    .card {
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      overflow: hidden;
      background: #1e1212;
      box-shadow:
        0 32px 64px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Hero image ── */
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
      transform: scale(1.04);
      animation: zoomOut 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    @keyframes zoomOut {
      to { transform: scale(1); }
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(30, 12, 12, 0.5) 70%,
        #1e1212 100%
      );
      pointer-events: none;
    }

    /* ── Contenu bas ── */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 28px 36px;
      gap: 22px;
    }

    /* ── Identité ── */
    .identity {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }

    .identity h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .identity .tagline {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .identity .tagline span {
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    /* ── Boutons ── */
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.58s forwards;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 12px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.22s ease,
        border-color 0.22s ease,
        color 0.22s ease,
        transform 0.18s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.5);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: 0.8;
    }

    /* ── Mobile : plein écran, contenu centré verticalement ── */
    @media (max-width: 540px) {
      body {
        align-items: stretch;
      }

      .card {
        border-radius: 0;
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        box-shadow: none;
      }

      .hero {
        aspect-ratio: auto;
        flex: 0 0 48%;
      }

      .content {
        flex: 1;
        justify-content: center;
        padding: 28px 24px 44px;
      }

      .identity h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

      </div>
    </div>
  </div>

</body>
</html>
